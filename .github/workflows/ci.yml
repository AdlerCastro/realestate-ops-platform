name: CI

on:
  pull_request:
    branches: [main, development]

# Cancela execuções anteriores do mesmo PR quando um novo push chega, evitando gastar minutos de
# CI validando um estado já superado.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, format e build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Node >= 22.14.0 é obrigatório: better-sqlite3@13.0.3 vem com um binário N-API
      # pré-compilado (prebuilds/linux-x64.node) que exige NAPI_VERSION 10. Confirmado
      # empiricamente (process.versions.napi) que Node 22.13.0 ainda expõe NAPI 9 e só a partir
      # de 22.14.0 o runtime passa a expor NAPI 10 — rodar esse pacote com Node < 22.14.0 (ex.:
      # a versão anterior deste pipeline, 20.9.0) causa SIGSEGV dentro de
      # napi_module_register_by_symbol / node::binding::DLOpen assim que `new Database(...)` é
      # chamado pela primeira vez (aqui, via a conexão eager de lib/db/connection.ts, disparada
      # durante "Collecting page data" do `next build`). Fonte única da versão: .nvmrc (ver
      # também README.md, seção de pré-requisitos).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check (Prettier)
        run: pnpm run format:check

      - name: Lint (ESLint)
        run: pnpm run lint

      # DATABASE_PATH é obrigatório aqui: lib/db/connection.ts instancia a conexão
      # better-sqlite3 de forma EAGER (no topo do módulo, fora de função — ver
      # `export const db = ... createConnection()`), então qualquer rota que importe esse
      # módulo transitivamente (ex.: app/api/auth/login/route.ts -> lib/features/auth/
      # repository.ts -> lib/db/connection.ts) dispara essa conexão assim que o Next.js importa
      # o módulo durante "Collecting page data" — mesmo sem a rota ser executada. Confirmado
      # localmente: `next build` sem DATABASE_PATH falha com
      # "DATABASE_PATH não definido" em lib/db/connection.ts:9. O valor abaixo aponta para
      # data/cambara_teste_tecnico.db, que está commitado no repositório (não está no
      # .gitignore) especificamente para viabilizar isso em CI/local sem segredo nenhum — é
      # dado de teste técnico, não produção.
      #
      # SESSION_SECRET e GROQ_API_KEY NÃO são definidos aqui: confirmado localmente que
      # `next build` completa com sucesso sem eles. SESSION_SECRET só é lido dentro de
      # `getSecret()` (lib/features/auth/session.ts), chamado em runtime (via `getSession()`,
      # que usa `cookies()` — isso força renderização dinâmica, então o corpo da função nunca
      # roda durante o build); GROQ_API_KEY não é referenciado por nenhuma feature ainda. Não
      # adicionamos um valor dummy para nenhum dos dois: não é necessário para o build passar, e
      # gerar segredo (ainda que dummy) sem necessidade real contraria a instrução de não decidir
      # sozinho sobre segredos. Se uma sessão futura tornar SESSION_SECRET necessário em
      # build-time (ex.: import eager em algum outro módulo), este step precisará ser revisado.
      - name: Build (Next.js)
        run: pnpm run build
        env:
          DATABASE_PATH: data/cambara_teste_tecnico.db
